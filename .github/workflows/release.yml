name: Release

on:
  push:
    tags: ['*.*.*']

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ github.ref_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag '${{ github.ref_name }}' is not a valid X.Y.Z version" >&2
            exit 1
          fi

      - name: Resolve build settings
        working-directory: MarkdownEditor
        shell: bash
        run: |
          set -euo pipefail
          BUILT_PRODUCTS_DIR=$(xcodebuild -project MarkdownEditor.xcodeproj -scheme MarkdownEditor \
            -configuration Release -showBuildSettings \
            | awk -F'= ' '/ BUILT_PRODUCTS_DIR /{print $2; exit}')
          if [ -z "$BUILT_PRODUCTS_DIR" ]; then
            echo "error: could not resolve BUILT_PRODUCTS_DIR" >&2
            exit 1
          fi
          echo "BUILT_PRODUCTS_DIR=$BUILT_PRODUCTS_DIR" >> "$GITHUB_ENV"

      - name: Build (Release, ad-hoc signed)
        working-directory: MarkdownEditor
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          xcodebuild -project MarkdownEditor.xcodeproj -scheme MarkdownEditor \
            -configuration Release build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" MARKETING_VERSION="$VERSION"

      - name: Package
        working-directory: MarkdownEditor
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$BUILT_PRODUCTS_DIR/MarkdownEditor.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "error: built app not found at $APP_PATH" >&2
            exit 1
          fi

          ZIP_NAME="MarkdownEditor-$VERSION.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_NAME"
          shasum -a 256 "$ZIP_NAME" | awk '{print $1}' > "$ZIP_NAME.sha256"

          mkdir -p "$RUNNER_TEMP/release-assets"
          mv "$ZIP_NAME" "$ZIP_NAME.sha256" "$RUNNER_TEMP/release-assets/"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes
          fi
          gh release upload "$VERSION" "$RUNNER_TEMP"/release-assets/* \
            --repo "$GITHUB_REPOSITORY" --clobber
